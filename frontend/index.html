<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeadRoom</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" id="main">
        <header>
            <h1>HeadRoom</h1>
            <span class="status" id="status">Scanning...</span>
            <button id="gear" class="icon-btn" title="Settings" onclick="openSettings()">⚙</button>
        </header>

        <section class="context">
            <h2 class="section-title" id="contextTitle">Context</h2>
            <div id="sessions" class="sessions">
                <!-- Sessions will be populated here -->
            </div>
        </section>

        <section id="limits" class="limits"></section>

        <div class="grow"></div>

        <footer>
            <span id="lastUpdate">--</span>
            <span class="footer-actions">
                <button class="icon-btn" onclick="resetAlerts()" title="Reset alert history">🔔</button>
                <button class="settings-btn" onclick="openSettings()" title="Theme, projects, limits and more">⚙ Settings</button>
            </span>
        </footer>
    </div>

    <div id="overlay" class="overlay" hidden></div>

    <script src="themes.js"></script>
    <script src="main.js"></script>
    <script src="settings.js"></script>
</body>
</html>
